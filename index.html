<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>בית הכנסת שלנו</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: right;
            margin: 20px;
            background-color: #f7f7f7;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .section {
            background-color: #ffffff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #ecf0f1;
        }
        ul {
            padding-right: 20px;
        }
    </style>
</head>
<body>

    <h1>ברוכים הבאים לבית הכנסת שלנו</h1>

    <div class="section">
        <h2>זמני תפילות להיום</h2>
        <table>
            <tr>
                <th>תפילה</th>
                <th>שעה</th>
            </tr>
            <tr>
                <td>שחרית</td>
                <td>07:00</td>
            </tr>
            <tr>
                <td>מנחה</td>
                <td>13:30</td>
            </tr>
            <tr>
                <td>ערבית</td>
                <td>19:00</td>
            </tr>
        </table>
    </div>

    <div class="section">
        <h2>הודעות קהילתיות</h2>
        <ul>
            <li>שיעור תנ"ך יתקיים ביום שני בשעה 18:00</li>
            <li>איסוף תרומות למען הקהילה במהלך השבוע</li>
            <li>אירוע חגיגי ביום חמישי בשעה 20:00</li>
        </ul>
    </div>

</body>
</html>
